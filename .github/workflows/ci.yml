# CI: the same checks as on a developer's PC, on every push to main and every pull request.
# Copied from Jay-S. Rust runs on Windows: the registry, the file lock and the setup are Windows code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory can come out for a dependency nobody touched: the audits also run every Monday.
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Tests and clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The test that downloads a real installer stays ignored.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Audits (dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      # shortcut: built from source on each run (~3 min); upgrade to a cached binary if the wait matters.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # The release's own binary, by its SHA-256 (from its checksums file), not an Action.
      - name: Secrets in the git history (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
