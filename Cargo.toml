[package]
name = "jay-i"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["TyxMatty"]
description = "The shared installer/updater engine of the Jay apps"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# WinHTTP: Windows' own proxy settings and certificates (src/http.rs).
windows = { version = "0.62", features = ["Win32_Networking_WinHttp"] }

[workspace]
members = [".", "setup"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
